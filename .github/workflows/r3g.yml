name: Build Xiaomi R3G LEDE
on:
  workflow_dispatch:
  repository_dispatch:

env:
  # 使用你自己fork的lede仓库
  REPO_URL: https://github.com/xsj520/lede
  REPO_BRANCH: master
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE: xiaomi_redmi_ax6s
  CONFIG_FILE: .config
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_BIN_DIR: false
  UPLOAD_LOG: true
  USE_GITHUB_MIRROR: true
  CREATE_RELEASE: true
  RELEASE_TITLE: "小米R3G LEDE固件 ${{ github.run_number }}"
  RELEASE_BODY: |
    自动编译LEDE固件
    设备：小米R3G(mt7621)
    源码：xsj520/lede（fork coolsnowwolf/lede）
    构建编号：${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment & Build
        uses: P3TERX/Actions-OpenWrt@main
        with:
          repo_url: ${{ env.REPO_URL }}
          repo_branch: ${{ env.REPO_BRANCH }}
          config_file: ${{ env.CONFIG_FILE }}
          diy_part1: ${{ env.DIY_PART1 }}
          diy_part2: ${{ env.DIY_PART2 }}
          target: ${{ env.TARGET }}
          subtarget: ${{ env.SUBTARGET }}
          device: ${{ env.DEVICE }}
          upload_firmware: ${{ env.UPLOAD_FIRMWARE }}
          upload_bin_dir: ${{ env.UPLOAD_BIN_DIR }}
          upload_log: ${{ env.UPLOAD_LOG }}
          use_github_mirror: ${{ env.USE_GITHUB_MIRROR }}
          create_release: ${{ env.CREATE_RELEASE }}
          release_title: ${{ env.RELEASE_TITLE }}
          release_body: ${{ env.RELEASE_BODY }}
