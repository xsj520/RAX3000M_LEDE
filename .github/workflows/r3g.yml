name: Build Xiaomi R3G LEDE
on:
  workflow_dispatch:
  repository_dispatch:

env:
  REPO_URL: https://github.com/xsj520/lede
  REPO_BRANCH: master
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part2.sh
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE: xiaomi_redmi_ax6s

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf wget curl swig rsync

      - name: Clone LEDE source
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          chmod +x ../${{ env.DIY_PART1 }} ../${{ env.DIY_PART2 }}
          ../${{ env.DIY_PART1 }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ../${{ env.DIY_PART2 }}
          make defconfig TARGET=${{ env.TARGET }} SUBTARGET=${{ env.SUBTARGET }} DEVICE=${{ env.DEVICE }}

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) download
          make -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.bin

      - name: Create Draft Release to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # 创建草稿release，不打tag
          gh release create "build-${{ github.run_number }}" \
            --draft \
            --target "${{ github.sha }}" \
            --title "小米R3G LEDE固件 #${{ github.run_number }}" \
            --notes "自动编译LEDE固件
设备：小米R3G(mt7621)
源码：xsj520/lede(fork coolsnowwolf/lede)
构建编号：${{ github.run_number }}" \
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.bin
