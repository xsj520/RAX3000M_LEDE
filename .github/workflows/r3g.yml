name: r3g
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/xsj520/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 3g.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part3.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE: xiaomi_mi_r3g

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf wget curl swig rsync

      - name: Clone LEDE source
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          chmod +x ../${{ env.DIY_P1_SH }} ../${{ env.DIY_P2_SH }}
          ../${{ env.DIY_P1_SH }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 先复制3g.config，再运行diy‑part3.sh，sed修改才不会被覆盖
          rm -f .config
          cp ../${{ env.CONFIG_FILE }} .config
          ../${{ env.DIY_P2_SH }}

      - name: Compile firmware
        id: compile
        run: |
          cd openwrt
          # 禁用node‑host配置
          sed -i 's/CONFIG_PACKAGE_node-host=y/# CONFIG_PACKAGE_node-host is not set/g' .config
          ./scripts/feeds install -a
          # ========== 关键：彻底删除node‑host源码，阻止编译，解决Python2.7报错 ==========
          rm -rf build_dir/hostpkg/node
          rm -rf package/feeds/packages/lang/node
          # ======================================================================
          go version
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "::set-output name=status::success"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "::set-output name=status::success"

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        run: |
          TAG=$(date +"%Y.%m.%d-%H%M")
          echo "release_tag=R3G_$TAG" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          touch release.txt
          echo "小米 R3G 固件" >> release.txt

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          generate_release_notes: false
