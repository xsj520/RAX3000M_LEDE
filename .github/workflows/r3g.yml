name: r3g
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/xsj520/lede
  REPO_BRANCH: master
  DIY_PART1: diy-part1.sh
  DIY_PART2: diy-part3.sh
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE: xiaomi_mi_r3g
  UPLOAD_RELEASE: 'true'
  UPLOAD_COWTRANSFER: 'false'
  UPLOAD_WETRANSFER: 'false'
  UPLOAD_BIN_DIR: 'false'
  UPLOAD_FIRMWARE: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch python3 python3-setuptools unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf wget curl swig rsync

      - name: Clone LEDE source
        run: |
          git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
          cd openwrt
          chmod +x ../${{ env.DIY_PART1 }} ../${{ env.DIY_PART2 }}
          ../${{ env.DIY_PART1 }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ../${{ env.DIY_PART2 }}
          make defconfig TARGET=${{ env.TARGET }} SUBTARGET=${{ env.SUBTARGET }} DEVICE=${{ env.DEVICE }}

      - name: Compile firmware
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          go version
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "::set-output name=status::success"
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Check space usage
        if: ${{ !cancelled() }}
        run: df -hT

      - name: Upload bin directory
        uses: actions/upload-artifact@main
        if: ${{ steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true' }}
        with:
          name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: openwrt/bin

      - name: Organize files
        id: organize
        if: ${{ env.UPLOAD_FIRMWARE == 'true' && !cancelled() }}
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "::set-output name=status::success"

      - name: Upload firmware directory
        uses: actions/upload-artifact@main
        if: ${{ steps.organize.outputs.status == 'success' && !cancelled() }}
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate release tag
        id: tag
        if: ${{ env.UPLOAD_RELEASE == 'true' && !cancelled() }}
        run: |
          TAG=$(date +"%Y.%m.%d-%H%M")
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          touch release.txt
          # 关键：真正创建git tag并推送回仓库
          git config --global user.name "github‑actions"
          git config --global user.email "actions@github.com"
          git tag $TAG
          git push origin $TAG

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.tag.outputs.status == 'success' && !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*

