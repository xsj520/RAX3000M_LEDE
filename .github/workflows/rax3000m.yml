name: rax3000m

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/xsj520/op
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: 3000m.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |

        # ==========================================
        # 安装 CMake 3.31.10
        # ==========================================
        sudo apt-get update

        wget -q https://github.com/Kitware/CMake/releases/download/v3.31.10/cmake-3.31.10-linux-x86_64.sh

        chmod +x cmake-3.31.10-linux-x86_64.sh

        sudo ./cmake-3.31.10-linux-x86_64.sh \
          --skip-license \
          --prefix=/usr/local

        rm -f cmake-3.31.10-linux-x86_64.sh

        # 确保使用 /usr/local/bin 下的 CMake
        export PATH="/usr/local/bin:$PATH"

        echo "=========================================="
        echo "CMake version:"
        which cmake
        cmake --version
        echo "=========================================="

        # ==========================================
        # 安装编译环境
        # ==========================================

        #sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc

        sudo add-apt-repository ppa:longsleep/golang-backports -y

        sudo -E apt-get -qq update

        sudo -E apt install -y \
          ack \
          antlr3 \
          asciidoc \
          autoconf \
          automake \
          autopoint \
          binutils \
          bison \
          build-essential \
          bzip2 \
          ccache \
          clang \
          cmake \
          cpio \
          curl \
          device-tree-compiler \
          ecj \
          fastjar \
          flex \
          gawk \
          gettext \
          gcc-multilib \
          g++-multilib \
          git \
          gnutls-dev \
          gperf \
          haveged \
          help2man \
          intltool \
          lib32gcc-s1 \
          libc6-dev-i386 \
          libelf-dev \
          libglib2.0-dev \
          libgmp3-dev \
          libltdl-dev \
          libmpc-dev \
          libmpfr-dev \
          libncurses-dev \
          libpython3-dev \
          libreadline-dev \
          libssl-dev \
          libtool \
          libyaml-dev \
          libz-dev \
          lld \
          llvm \
          lrzsz \
          mkisofs \
          msmtp \
          nano \
          ninja-build \
          p7zip \
          p7zip-full \
          patch \
          pkgconf \
          python3 \
          python3-pip \
          python3-ply \
          python3-docutils \
          python3-pyelftools \
          qemu-utils \
          re2c \
          rsync \
          scons \
          squashfs-tools \
          subversion \
          swig \
          texinfo \
          uglifyjs \
          upx-ucl \
          unzip \
          vim \
          wget \
          xmlto \
          xxd \
          zlib1g-dev \
          zstd

        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

        sudo apt install golang -y

        sudo timedatectl set-timezone "$TZ"

        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

        # ==========================================
        # 再次确认 CMake
        # ==========================================

        export PATH="/usr/local/bin:$PATH"

        echo "=========================================="
        echo "最终 CMake 检查:"
        which cmake
        cmake --version
        echo "=========================================="

        # ==========================================
        # 系统信息
        # ==========================================

        echo "========== CPU信息 =========="
        lscpu | grep -E "Model name|C
